name: Build and publish Linux release binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: amd64
          - target: aarch64-unknown-linux-gnu
            artifact: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          # 0.15.0 was retracted; pin a real release for reproducible CI.
          version: 0.16.0
          # Distinguish matrix jobs in the Zig cache key.
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build release binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/atm-rust" "release/atm-rust-linux-${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atm-rust-linux-${{ matrix.artifact }}
          path: release/atm-rust-linux-${{ matrix.artifact }}

  publish:
    name: Tag and publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Configure Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release tag
        id: tag
        run: |
          DATE=$(date -u +%Y.%m.%d)
          SHORT_SHA=${GITHUB_SHA:0:7}
          RELEASE_TAG=v${DATE}-${SHORT_SHA}
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "Release tag will be $RELEASE_TAG"

      - name: Create and push tag
        run: |
          git tag "${{ steps.tag.outputs.release_tag }}"
          git push origin "${{ steps.tag.outputs.release_tag }}"

      - name: Publish assets to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.release_tag }}
          name: ${{ steps.tag.outputs.release_tag }}
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
