name: Build and publish Linux release binaries

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; publish elevates only what it needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: amd64
          - target: aarch64-unknown-linux-gnu
            artifact: arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Cargo registry and git
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          # 0.15.0 was retracted; pin a real release for reproducible CI.
          version: 0.16.0
          # Distinguish matrix jobs in the Zig cache key.
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild --locked

      - name: Build release binary
        run: cargo zigbuild --release --target ${{ matrix.target }}

      - name: Package artifact
        run: |
          mkdir -p release
          cp "target/${{ matrix.target }}/release/atm-rust" "release/atm-rust-linux-${{ matrix.artifact }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: atm-rust-linux-${{ matrix.artifact }}
          path: release/atm-rust-linux-${{ matrix.artifact }}

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Create tag + release + assets via the GitHub API (no git push).
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Set release tag
        id: meta
        run: |
          DATE=$(date -u +%Y.%m.%d)
          SHORT_SHA=${GITHUB_SHA:0:7}
          RELEASE_TAG="v${DATE}-${SHORT_SHA}"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Release tag: ${RELEASE_TAG}"
          ls -la release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/atm-rust-linux-amd64
            release/atm-rust-linux-arm64
